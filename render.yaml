# Despliegue en Render como un único servicio: el mismo proceso sirve el cliente
# compilado y mantiene abiertas las conexiones WebSocket de las sesiones.
services:
  - type: web
    name: constelaciones
    runtime: node
    plan: free
    buildCommand: npm run build:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '20'
      # Firma las sesiones iniciadas. Render la genera una vez y la conserva,
      # así nadie tiene que volver a entrar a su cuenta tras un reinicio.
      - key: AUTH_SECRET
        generateValue: true
      # DATABASE_URL se agrega a mano en el panel de Render (Environment). Sin
      # ella las cuentas se guardan en un archivo que el plan gratuito borra en
      # cada redespliegue; con ella viven en Postgres y son permanentes.
